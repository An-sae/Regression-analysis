name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours at :00 UTC  (00:00, 06:00, 12:00, 18:00)
    # Streamlit sleeps after 12 h of inactivity — 6 h is a safe margin
    - cron: "0 */6 * * *"
  workflow_dispatch:   # allow manual trigger from the GitHub Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
        run: python .github/scripts/wake_streamlit.py
