# Method Comparison Tool — konfiguration
#
# Denna fil fungerar BADE lokalt och pa Streamlit Cloud.
#
# Notera: server.address star medvetet INTE har. Pa Streamlit Cloud
# maste appen lyssna pa alla granssnitt inuti containern, annars nas
# den inte. Lokalt lases den till localhost av STARTA.bat i stallet,
# via flaggan --server.address=localhost.

[server]
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true

[theme]
base = "light"
